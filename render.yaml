services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (Express API + BullMQ Worker + Bull-Board)
  # -------------------------------------------------------------
  - type: web
    name: openbox-backend
    env: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: openbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: openbox-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: GMAIL_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MIN_EMAIL_DELAY_MS
        value: 2000
      - key: MAX_EMAILS_PER_HOUR
        value: 100

  # -------------------------------------------------------------
  # 2. Frontend Static Site (Vite React SPA)
  # -------------------------------------------------------------
  - type: static
    name: openbox-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      # Rewrite API calls directly to the backend web service (seamless CORS-free proxy)
      - type: rewrite
        source: /api/*
        destination: https://openbox-backend.onrender.com/api/*
      # SPA fallback routing
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: /api

# ---------------------------------------------------------------
# 3. Managed PostgreSQL Database
# ---------------------------------------------------------------
databases:
  - name: openbox-db
    plan: starter
    databaseName: email_scheduler
    user: reachinbox_user
